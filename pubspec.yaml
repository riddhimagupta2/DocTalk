name: doctalk
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  geocoding: ^3.0.0
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6

  # Firebase (aligned versions)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.6.12

  # AI
  google_generative_ai: ^0.4.3

  # Location & Maps
  geolocator: ^12.0.0
  google_maps_flutter: ^2.7.0
  google_places_flutter: ^2.0.6
  url_launcher: ^6.3.0

  # UI
  lottie: ^3.1.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  animate_do: ^3.3.4

  # Utils
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  http: ^1.2.2
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true